<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ground Control · Whiteboard</title>
  <style>
    :root {
      --bg: #0e1114;
      --panel: #161b20;
      --line: #2a323a;
      --text: #e8ecef;
      --muted: #8b969e;
      --accent: #3d9a7a;
      --warn: #c4a35a;
      --danger: #c45c5c;
      --info: #5a8fc4;
      --font: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px;
    }
    body {
      display: grid;
      grid-template-rows: auto auto 1fr;
      min-height: 100vh;
      background:
        radial-gradient(1200px 600px at 10% -10%, #1a2830 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2220 0%, transparent 50%),
        var(--bg);
    }
    header {
      display: flex; align-items: baseline; gap: 1.25rem;
      padding: 1rem 1.5rem 0.75rem;
      border-bottom: 1px solid var(--line);
    }
    header h1 {
      margin: 0; font-size: 1.35rem; font-weight: 600; letter-spacing: 0.02em;
    }
    header .sub { color: var(--muted); font-size: 0.85rem; }
    header .live {
      margin-left: auto; color: var(--accent); font-family: var(--mono); font-size: 0.75rem;
    }
    .kpis {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      padding: 0.85rem 1.5rem;
      border-bottom: 1px solid var(--line);
    }
    .kpi {
      background: var(--panel); border: 1px solid var(--line);
      padding: 0.55rem 0.85rem; min-width: 7rem;
    }
    .kpi .label { color: var(--muted); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }
    .kpi .value { font-size: 1.15rem; font-weight: 600; font-family: var(--mono); margin-top: 0.15rem; }
    main {
      display: grid;
      grid-template-columns: 1.6fr 1fr;
      gap: 0;
      min-height: 0;
    }
    .board {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 0.65rem;
      padding: 1rem 1.25rem;
      overflow: auto;
      border-right: 1px solid var(--line);
    }
    .col {
      background: color-mix(in srgb, var(--panel) 88%, black);
      border: 1px solid var(--line);
      min-height: 12rem;
      display: flex; flex-direction: column;
    }
    .col h2 {
      margin: 0; padding: 0.55rem 0.65rem;
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between;
    }
    .col .cards { padding: 0.45rem; display: flex; flex-direction: column; gap: 0.45rem; flex: 1; }
    .card {
      background: var(--panel); border: 1px solid var(--line);
      padding: 0.55rem 0.6rem; cursor: default;
    }
    .card .title { font-weight: 600; font-size: 0.9rem; }
    .card .goal {
      color: var(--muted); font-size: 0.75rem; margin-top: 0.25rem;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card .meta {
      margin-top: 0.4rem; font-family: var(--mono); font-size: 0.65rem; color: var(--muted);
    }
    .card .markers { margin-top: 0.35rem; display: flex; flex-wrap: wrap; gap: 0.25rem; }
    .chip {
      font-size: 0.65rem; font-family: var(--mono);
      padding: 0.1rem 0.35rem; border: 1px solid var(--line); color: var(--text);
      background: #12161a;
    }
    .side {
      display: grid; grid-template-rows: 1fr 1fr; min-height: 0;
    }
    .panel {
      border-bottom: 1px solid var(--line); min-height: 0; overflow: auto;
      padding: 0.85rem 1rem;
    }
    .panel h2 {
      margin: 0 0 0.6rem; font-size: 0.72rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--muted);
    }
    .term {
      background: #0a0c0e; border: 1px solid var(--line); margin-bottom: 0.55rem;
      padding: 0.45rem 0.55rem;
    }
    .term .head {
      display: flex; justify-content: space-between; font-family: var(--mono);
      font-size: 0.7rem; color: var(--muted); margin-bottom: 0.35rem;
    }
    .term pre {
      margin: 0; white-space: pre-wrap; word-break: break-word;
      font-family: var(--mono); font-size: 0.68rem; color: #c5d0d8;
      max-height: 9rem; overflow: auto;
    }
    .task {
      border: 1px solid var(--line); padding: 0.4rem 0.5rem; margin-bottom: 0.4rem;
      font-size: 0.8rem;
    }
    .task .row { display: flex; justify-content: space-between; gap: 0.5rem; }
    .dot { width: 0.45rem; height: 0.45rem; border-radius: 50%; display: inline-block; margin-right: 0.35rem; }
    .dot.ok { background: var(--accent); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--danger); }
    .dot.info { background: var(--info); }
    .empty { color: var(--muted); font-size: 0.8rem; padding: 0.5rem; }
    a.open-full {
      color: var(--accent); text-decoration: none; font-size: 0.75rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ground Control</h1>
    <span class="sub">Mission whiteboard · local Mac</span>
    <span class="live" id="live">connecting…</span>
  </header>
  <section class="kpis" id="kpis"></section>
  <main>
    <section class="board" id="board"></section>
    <aside class="side">
      <div class="panel">
        <h2>Terminals</h2>
        <div id="terminals"></div>
      </div>
      <div class="panel">
        <h2>Jobs &amp; approvals</h2>
        <div id="jobs"></div>
      </div>
    </aside>
  </main>
  <script>
    const COLS = ["intake","researching","plan_ready","approved","implementing","verifying","done","blocked","cancelled"];
    const COL_LABEL = {
      intake: "Intake", researching: "Research", plan_ready: "Plan ready",
      approved: "Approved", implementing: "Implementing", verifying: "Verifying",
      done: "Done", blocked: "Blocked", cancelled: "Cancelled"
    };
    function esc(s) {
      return String(s ?? "").replace(/[&<>"']/g, (c) => ({
        "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
      })[c]);
    }
    function statusDot(status) {
      if (status === "running" || status === "approved" || status === "done") return "ok";
      if (status === "failed" || status === "blocked" || status === "error") return "bad";
      if (status === "plan_ready" || status === "awaiting_followup" || status === "pending") return "warn";
      return "info";
    }
    async function tick() {
      try {
        const res = await fetch("/api/board");
        if (!res.ok) throw new Error("board " + res.status);
        const data = await res.json();
        render(data);
        document.getElementById("live").textContent =
          "live · " + new Date(data.at).toLocaleTimeString();
      } catch (err) {
        document.getElementById("live").textContent = "offline · " + err.message;
      }
    }
    function render(data) {
      const h = data.health || {};
      const kpiEl = document.getElementById("kpis");
      const top = [
        ["Active missions", h.active_missions ?? 0],
        ["Open terminals", h.open_terminals ?? 0],
        ["Pending approvals", h.pending_approvals ?? 0],
        ["Kimi starts left (5h)", h.kimi_starts_left ?? "—"],
        ["Cursor starts left", h.cursor_starts_left ?? "—"],
        ["Queued bugfixes", h.queued_bugfixes ?? 0],
        ["Active jobs", (data.active_tasks || []).length],
      ];
      const fromMissions = (data.kpis || []).slice(0, 8).map((k) => [k.key + " · " + k.mission, k.value]);
      kpiEl.innerHTML = [...top, ...fromMissions].map(([label, value]) =>
        `<div class="kpi"><div class="label">${esc(label)}</div><div class="value">${esc(value)}</div></div>`
      ).join("");

      const board = document.getElementById("board");
      board.innerHTML = COLS.map((col) => {
        const cards = (data.columns && data.columns[col]) || [];
        return `<div class="col"><h2><span>${COL_LABEL[col] || col}</span><span>${cards.length}</span></h2>
          <div class="cards">${cards.length ? cards.map(cardHtml).join("") : '<div class="empty">—</div>'}</div></div>`;
      }).join("");

      const terms = data.terminal_sessions || [];
      document.getElementById("terminals").innerHTML = terms.length
        ? terms.map((t) => `<div class="term"><div class="head">
            <span><span class="dot ${statusDot(t.state)}"></span>${esc(t.kind)} · ${esc(t.workspace || "")}</span>
            <span>${esc(t.state)}</span></div>
            <pre>${esc(t.output_tail || "(no output yet)")}</pre></div>`).join("")
        : '<div class="empty">No interactive sessions</div>';

      const jobs = data.active_tasks || [];
      const pending = (data.approvals || []).filter((a) => a.status === "pending");
      const jobHtml = jobs.map((j) => `<div class="task"><div class="row">
          <span><span class="dot ${statusDot(j.status)}"></span>${esc(j.agent)} · ${esc(j.status)}</span>
          <span class="meta">${esc((j.id || "").slice(0, 8))}</span></div>
          <div class="goal">${esc(j.summary || j.project_id || "")}</div></div>`).join("");
      const apprHtml = pending.map((a) => `<div class="task"><div class="row">
          <span><span class="dot warn"></span>Approval · ${esc(a.kind)}</span></div>
          <div class="goal">${esc(a.title)}</div></div>`).join("");
      document.getElementById("jobs").innerHTML =
        (jobHtml || apprHtml)
          ? jobHtml + apprHtml
          : '<div class="empty">No active jobs or approvals</div>';
    }
    function cardHtml(m) {
      const markers = Object.entries(m.markers || {}).slice(0, 4)
        .map(([k, v]) => `<span class="chip">${esc(k)}=${esc(v)}</span>`).join("");
      return `<div class="card">
        <div class="title">${esc(m.title)}</div>
        <div class="goal">${esc(m.goal)}</div>
        <div class="meta">${esc(m.workspace || "—")} · ${esc((m.updated_at || "").slice(11, 19))}</div>
        ${markers ? `<div class="markers">${markers}</div>` : ""}
      </div>`;
    }
    tick();
    setInterval(tick, 3000);
  </script>
</body>
</html>
